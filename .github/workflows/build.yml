name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          unzip -o "$ZIP" -d project
          GRADLEW=$(find project -name gradlew -type f | head -n 1)
          ROOT=$(dirname "$GRADLEW")
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x "$PROJECT_ROOT/gradlew"

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hafidh-R4-Remote-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
