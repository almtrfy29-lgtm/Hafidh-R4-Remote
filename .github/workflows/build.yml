name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          unzip -o "$ZIP" -d project

      - name: Find project
        run: |
          BUILD_FILE=$(find project -name build.gradle -o -name build.gradle.kts | head -n 1)
          PROJECT_ROOT=$(dirname "$BUILD_FILE")
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_ROOT"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hafidh-R4-Remote-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
